[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-videogen-deepagents"
version = "0.1.0"
description = "Rubric-gated LangChain DeepAgents pipeline for GTM video generation with zero hard templates."
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.41,<0.8",
    "langgraph>=1.2.24",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.15",
    "rich>=13.0",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "langchain-openai>=1.8.5",
]

[project.optional-dependencies]
manim = [
    "manim>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
gtm-videogen = "gtm_videogen.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_videogen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
