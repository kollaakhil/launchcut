services:
  launchcut:
    build: .
    container_name: launchcut-studio
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - GTM_DATA_DIR=/app/.data
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
