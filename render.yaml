services:
  - type: web
    name: launchcut-studio
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: GTM_DATA_DIR
        value: /app/.data
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: GTM_FAST_MODEL
        value: anthropic/claude-haiku-5.5
      - key: GTM_FLAGSHIP_MODEL
        value: anthropic/claude-haiku-5.5
      - key: GTM_TEXT_MODEL
        value: anthropic/claude-haiku-5.5
      - key: GTM_VISION_MODEL
        value: google/gemini-3.8-flash
      - key: GTM_IMAGE_MODEL
        value: fal-ai/flux/schnell
      - key: GTM_VIDEO_MODEL
        value: kling/v4/flash/text-to-video
      - key: GTM_VOICE_MODEL
        value: fal-ai/elevenlabs/tts/eleven-v3
      - key: GTM_SFX_MODEL
        value: mirelo-ai/sfx2.0/text-to-audio
      - key: GTM_MUSIC_MODEL
        value: fal-ai/stable-audio-25/text-to-audio
